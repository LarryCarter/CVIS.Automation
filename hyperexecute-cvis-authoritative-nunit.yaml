version: "0.1"
runson: win

autosplit: false
concurrency: 1
testRunnerExecutor: cmd
workingDirectory: .

pre:
  - if exist .\TestResults rmdir /s /q .\TestResults

testSuites:
  - powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-cvis-authoritative-report-local.ps1

post:
  - if not exist .\TestResults\CPN\cpn-report.html exit /b 1

report: true
partialReports:
  type: nunit
  location: .\TestResults\NUnitXml
  frameworkName: nunit

mergeArtifacts: true
uploadArtefacts:
  - name: cvis-authoritative-test-output
    path:
      - .\TestResults\NUnitXml
      - .\TestResults\TRX
      - .\TestResults\CPN
