version: "0.1"
runson: win

autosplit: false
concurrency: 1
testRunnerExecutor: cmd
workingDirectory: .

pre:
  - if exist .\TestResults rmdir /s /q .\TestResults
  - dotnet restore .\CVIS.Automation.sln
  - dotnet build .\CVIS.Automation.sln --no-restore

testSuites:
  - powershell -ExecutionPolicy Bypass -File .\scripts\run-cvis-authoritative-report-hyperexecute.ps1 -Configuration Debug -MinimumTotal 250

report: true
partialReports:
  type: nunit
  location: .\TestResults\NUnitXml
  frameworkName: nunit

mergeArtifacts: true
uploadArtefacts:
  - name: cvis-authoritative-test-output
    path:
      - .\TestResults\NUnitXml
      - .\TestResults\TRX
      - .\TestResults\CPN
      - .\docs
