version: "0.1"
runson: win

autosplit: false
concurrency: 1
testRunnerExecutor: cmd
workingDirectory: .

pre:
  - if exist .\TestResults rmdir /s /q .\TestResults
  - dotnet restore .\CVIS.Automation.Tests\CVIS.Automation.Tests.csproj
  - dotnet restore .\CVIS.Playwright.NUnitCompat.Tests\CVIS.Playwright.NUnitCompat.Tests.csproj
  - dotnet restore .\CVIS.Playwright.Reporting.Tool\CVIS.Playwright.Reporting.Tool.csproj
  - dotnet build .\CVIS.Automation.Tests\CVIS.Automation.Tests.csproj --no-restore
  - dotnet build .\CVIS.Playwright.NUnitCompat.Tests\CVIS.Playwright.NUnitCompat.Tests.csproj --no-restore
  - dotnet build .\CVIS.Playwright.Reporting.Tool\CVIS.Playwright.Reporting.Tool.csproj --no-restore

testSuites:
  - dotnet test .\CVIS.Automation.Tests\CVIS.Automation.Tests.csproj --no-build --logger "trx;LogFileName=CVIS.Automation.Tests.trx" --results-directory ".\TestResults\TRX\CVIS.Automation.Tests" -- NUnit.TestOutputXml=.\TestResults\NUnitXml\CVIS.Automation.Tests
  - dotnet test .\CVIS.Playwright.NUnitCompat.Tests\CVIS.Playwright.NUnitCompat.Tests.csproj --no-build --logger "trx;LogFileName=CVIS.Playwright.NUnitCompat.Tests.trx" --results-directory ".\TestResults\TRX\CVIS.Playwright.NUnitCompat.Tests" -- NUnit.TestOutputXml=.\TestResults\NUnitXml\CVIS.Playwright.NUnitCompat.Tests

post:
  - dotnet run --project .\CVIS.Playwright.Reporting.Tool\CVIS.Playwright.Reporting.Tool.csproj -- --trx-root .\TestResults\TRX --nunit-xml-root .\TestResults\NUnitXml --output-root .\TestResults\CPN --framework-name "CVIS HyperExecute Authoritative Test Run" --minimum-total 250

report: true
partialReports:
  type: nunit
  location: .\TestResults\NUnitXml
  frameworkName: nunit

mergeArtifacts: true
uploadArtefacts:
  - name: cvis-authoritative-test-output
    path:
      - .\TestResults\NUnitXml
      - .\TestResults\TRX
      - .\TestResults\CPN
